<!DOCTYPE html>
<html>

<head>
    <title>{$node.node_title}</title>
    {include file="common/header"/}

    <!-- 统计卡片 -->
    <div class="stats-container" style="margin-bottom: 20px;">
        <el-row :gutter="20">
            <el-col :span="6">
                <div class="stat-card" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; border-radius: 8px; color: white;">
                    <div style="font-size: 14px; opacity: 0.9;">今日搜索</div>
                    <div style="font-size: 32px; font-weight: bold; margin-top: 10px;">{{stats.today}}</div>
                </div>
            </el-col>
            <el-col :span="6">
                <div class="stat-card" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); padding: 20px; border-radius: 8px; color: white;">
                    <div style="font-size: 14px; opacity: 0.9;">本周搜索</div>
                    <div style="font-size: 32px; font-weight: bold; margin-top: 10px;">{{stats.week}}</div>
                </div>
            </el-col>
            <el-col :span="6">
                <div class="stat-card" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); padding: 20px; border-radius: 8px; color: white;">
                    <div style="font-size: 14px; opacity: 0.9;">本月搜索</div>
                    <div style="font-size: 32px; font-weight: bold; margin-top: 10px;">{{stats.month}}</div>
                </div>
            </el-col>
            <el-col :span="6">
                <div class="stat-card" style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); padding: 20px; border-radius: 8px; color: white;">
                    <div style="font-size: 14px; opacity: 0.9;">总搜索</div>
                    <div style="font-size: 32px; font-weight: bold; margin-top: 10px;">{{stats.total}}</div>
                </div>
            </el-col>
        </el-row>
    </div>

    <!-- 操作按钮 -->
    <div style="margin-bottom: 15px;">
        <el-button type="primary" icon="el-icon-plus" @click="confirmBatchAdd">增加100条记录(昨天)</el-button>
        <el-button type="danger" icon="el-icon-delete" @click="confirmClear">清空所有数据</el-button>
    </div>

    <el-table :data="dataList.data"  v-loading="loading">
        <el-table-column prop="id" label="ID" align="center" width="100">
        </el-table-column>
        <el-table-column prop="content" label="用户想要的资源描述">
        </el-table-column>
        <el-table-column prop="create_time" label="提交时间" align="center" width="200">
        </el-table-column>
    </el-table>


    <div class="page">
        <el-pagination @size-change="handleSizeChange" :page-sizes="[10, 20, 50, 100,200,500]" :page-size="10"
            layout="total, sizes, prev, pager, next, jumper" background @current-change="changeCurrentPage"
            :current-page="dataList.current_page" :page-count="dataList.last_page" :total="dataList.total">
        </el-pagination>
    </div>

    {include file="common/footer"/}
    <script>
        var app = new Vue({
            el: '#app',
            data() {
                return {
                    loading: true,
                    dataList: [],
                    stats: {
                        today: 0,
                        week: 0,
                        month: 0,
                        total: 0
                    },
                    form: {
                        page: 1,
                        per_page: 10,
                        order: 'id desc'
                    },
                }
            },
            created() {
                this.getList();
                this.getStats();
            },
            methods: {
                handleSizeChange(per_page) {
                    this.form.per_page = per_page;
                    this.getList();
                },
                changeCurrentPage(page) {
                    this.form.page = page;
                    this.getList();
                },
                getList() {
                    var that = this;
                    that.loading = true;
                    axios.post('/admin/feedback/getList', Object.assign({}, PostBase, that.form))
                        .then(function (response) {
                            that.loading = false;
                            if (response.data.code == CODE_SUCCESS) {
                                that.dataList = response.data.data;
                            } else {
                                that.$message.error(response.data.message);
                            }
                        })
                        .catch(function (error) {
                            that.loading = false;
                            that.$message.error('服务器内部错误');
                        });
                },
                getStats() {
                    var that = this;
                    axios.post('/admin/feedback/getStats', Object.assign({}, PostBase))
                        .then(function (response) {
                            if (response.data.code == CODE_SUCCESS) {
                                that.stats = response.data.data;
                            }
                        })
                        .catch(function (error) {
                            console.error('获取统计数据失败', error);
                        });
                },
                confirmClear() {
                    var that = this;
                    this.$confirm('确定要清空所有数据吗？此操作不可恢复！', '警告', {
                        confirmButtonText: '确定',
                        cancelButtonText: '取消',
                        type: 'warning'
                    }).then(function () {
                        that.clearAll();
                    }).catch(function () {
                        // 取消操作
                    });
                },
                clearAll() {
                    var that = this;
                    axios.post('/admin/feedback/clearAll', Object.assign({}, PostBase))
                        .then(function (response) {
                            if (response.data.code == CODE_SUCCESS) {
                                that.$message.success('清空成功');
                                that.getList();
                                that.getStats();
                            } else {
                                that.$message.error(response.data.message);
                            }
                        })
                        .catch(function (error) {
                            that.$message.error('清空失败');
                        });
                },
                confirmBatchAdd() {
                    var that = this;
                    this.$confirm('确定要添加100条测试记录吗？内容为"[夸克] 哪吒之魔童闹海"，提交时间为昨天。', '提示', {
                        confirmButtonText: '确定',
                        cancelButtonText: '取消',
                        type: 'info'
                    }).then(function () {
                        that.batchAdd();
                    }).catch(function () {
                        // 取消操作
                    });
                },
                batchAdd() {
                    var that = this;
                    that.loading = true;
                    axios.post('/admin/feedback/batchAdd', Object.assign({}, PostBase, {
                        content: '[夸克] 哪吒之魔童闹海',
                        count: 100,
                        day: 'yesterday'
                    }))
                        .then(function (response) {
                            that.loading = false;
                            if (response.data.code == CODE_SUCCESS) {
                                that.$message.success(response.data.message);
                                that.getList();
                                that.getStats();
                            } else {
                                that.$message.error(response.data.message);
                            }
                        })
                        .catch(function (error) {
                            that.loading = false;
                            that.$message.error('添加失败');
                        });
                }
            }
        })
    </script>


</html>
