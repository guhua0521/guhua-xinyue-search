<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
        (function() {
            var savedTheme = localStorage.getItem('app-theme') || 'red';
            document.documentElement.setAttribute('data-theme', savedTheme);
            document.documentElement.setAttribute('data-page-loading', '');
        })();
    </script>
    <style>
        [v-cloak] {
            display: none !important;
        }
        el-dialog,
        el-input,
        el-button {
            display: none !important;
        }
        [data-page-loading] #app {
            visibility: hidden !important;
        }
        [data-page-loading] body,
        [data-page-loading] html {
            background-color: #f5f5f5 !important;
        }
        [data-theme="red"] body,
        [data-theme="red"] html,
        [data-theme="orange"] body,
        [data-theme="orange"] html,
        [data-theme="green"] body,
        [data-theme="green"] html,
        [data-theme="purple"] body,
        [data-theme="purple"] html {
            background-color: #f5f5f5 !important;
        }
        [data-theme="blue"] body,
        [data-theme="blue"] html {
            background-color: #f0f5ff !important;
        }
        [data-theme="dark"] body,
        [data-theme="dark"] html {
            background-color: #0f0f1a !important;
        }
    </style>
    {notempty name="config.app_icon"}
    <link rel="icon" href="{$config.app_icon}" />
    {/notempty}
    <meta name="renderer" content="webkit">
    <meta name="viewport" content="width=device-width,user-scalable=no,maximum-scale=1.0">
    <title>{$seo_title}</title>
    <meta name="keywords" content="{$seo_keywords}" />
    <meta name="description" content="{$seo_description}" />
    <meta name="referrer" content="no-referrer">
    <link rel="stylesheet" href="__STATIC__/news/common/static/css/index.min.css">
    <link rel="stylesheet" href="__STATIC__/news/common/static/css/app.css">
    <link rel="stylesheet" href="__STATIC__/news/common/static/css/m.css">
    
    {$config.seo_statistics|raw}
    
    <style>
        /* 主题配色方案 - 默认红 */
        :root,
        [data-theme="red"] {
            --theme-primary: #ff6b6b;
            --theme-primary-light: #ff8e53;
            --theme-primary-gradient: linear-gradient(135deg, #ff6b6b 0%, #ff8e53 100%);
            --theme-primary-hover: #ff5252;
            --theme-secondary-gradient: linear-gradient(135deg, #ff8e53 0%, #ffa940 100%);
            --theme-tertiary-gradient: linear-gradient(135deg, #ffa940 0%, #ffc53d 100%);
            --theme-background: #f5f5f5;
            --theme-surface: #ffffff;
            --theme-card: #fff8f0;
            --theme-card-gradient: linear-gradient(135deg, #fff8f0 0%, #fff0f0 100%);
            --theme-text: #333333;
            --theme-text-secondary: #666666;
            --theme-border: #f0f0f0;
        }

        /* 海洋蓝主题 */
        [data-theme="blue"] {
            --theme-primary: #4a90e2;
            --theme-primary-light: #5fa3f0;
            --theme-primary-gradient: linear-gradient(135deg, #4a90e2 0%, #5fa3f0 100%);
            --theme-primary-hover: #3a7bc8;
            --theme-secondary-gradient: linear-gradient(135deg, #5fa3f0 0%, #7eb8f7 100%);
            --theme-tertiary-gradient: linear-gradient(135deg, #7eb8f7 0%, #9dcdff 100%);
            --theme-background: #f0f4f8;
            --theme-surface: #ffffff;
            --theme-card: #f0f8ff;
            --theme-card-gradient: linear-gradient(135deg, #f0f8ff 0%, #e6f2ff 100%);
            --theme-text: #2c3e50;
            --theme-text-secondary: #5a6c7d;
            --theme-border: #e1e8ed;
        }

        /* 森林绿主题 */
        [data-theme="green"] {
            --theme-primary: #27ae60;
            --theme-primary-light: #2ecc71;
            --theme-primary-gradient: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            --theme-primary-hover: #229954;
            --theme-secondary-gradient: linear-gradient(135deg, #2ecc71 0%, #58d68d 100%);
            --theme-tertiary-gradient: linear-gradient(135deg, #58d68d 0%, #82e0aa 100%);
            --theme-background: #f0f7f4;
            --theme-surface: #ffffff;
            --theme-card: #f0faf4;
            --theme-card-gradient: linear-gradient(135deg, #f0faf4 0%, #e6f5eb 100%);
            --theme-text: #1e3a2f;
            --theme-text-secondary: #4a6356;
            --theme-border: #d4e6dc;
        }

        /* 暗夜黑主题 */
        [data-theme="dark"] {
            --theme-primary: #6366f1;
            --theme-primary-light: #8b5cf6;
            --theme-primary-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --theme-primary-hover: #4f46e5;
            --theme-secondary-gradient: linear-gradient(135deg, #8b5cf6 0%, #a78bfa 100%);
            --theme-tertiary-gradient: linear-gradient(135deg, #a78bfa 0%, #c4b5fd 100%);
            --theme-background: #0f0f1a;
            --theme-surface: #1a1a2e;
            --theme-card: #252538;
            --theme-card-gradient: linear-gradient(135deg, #252538 0%, #1e1e32 100%);
            --theme-text: #f0f0f5;
            --theme-text-secondary: #a0a0b0;
            --theme-border: #3a3a4a;
            --theme-text-muted: #808090;
        }
        
        body {
            background-color: var(--theme-background) !important;
            color: var(--theme-text);
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        {$config.home_css}
    </style>
    <script>
        window.SITE_POPUP_AD = {:json_encode([
            'enable'  => isset($config['ad_popup_enable']) && $config['ad_popup_enable'] == '1' ? 1 : 0,
            'title'   => isset($config['ad_popup_title']) ? $config['ad_popup_title'] : '',
            'image'   => isset($config['ad_popup_image']) ? $config['ad_popup_image'] : '',
            'content' => isset($config['ad_popup_content']) ? $config['ad_popup_content'] : '',
            'link'    => isset($config['ad_popup_link']) ? $config['ad_popup_link'] : '',
            'btn'     => isset($config['ad_popup_btn']) && $config['ad_popup_btn'] ? $config['ad_popup_btn'] : '知道了',
        ])};
    </script>
    <script>
        // 进站弹窗广告：后台可配置，每个访客每次进站只弹一次（浏览器会话内不重复）
        (function () {
            var cfg = window.SITE_POPUP_AD || { enable: 0 };
            function init() {
                if (!cfg || cfg.enable != 1) return;
                if (!cfg.title && !cfg.image && !cfg.content) return;
                var shown = false;
                try {
                    shown = sessionStorage.getItem('site_popup_ad_shown');
                    sessionStorage.setItem('site_popup_ad_shown', '1');
                } catch (e) { shown = false; }
                if (shown) return;

                var wrap = document.createElement('div');
                wrap.id = 'site-popup-ad';
                wrap.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:999999;display:flex;align-items:center;justify-content:center;';
                var h = '<div class="spa-mask" style="position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.55);"></div>';
                h += '<div class="spa-box" style="position:relative;width:92%;max-width:420px;max-height:85vh;overflow:auto;background:#fff;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.3);z-index:1;animation:spaIn .3s ease;">';
                h += '<div class="spa-close" style="position:absolute;right:8px;top:6px;width:30px;height:30px;line-height:28px;text-align:center;font-size:22px;color:#999;cursor:pointer;z-index:2;border-radius:50%;background:rgba(255,255,255,.9);">×</div>';
                if (cfg.image) {
                    h += '<img src="' + cfg.image + '" alt="广告" style="width:100%;display:block;max-height:40vh;object-fit:cover;" onerror="this.style.display=\'none\'">';
                }
                h += '<div style="padding:18px 22px 24px;text-align:center;">';
                if (cfg.title) {
                    h += '<div class="spa-title" style="font-size:18px;font-weight:700;color:#222;margin-bottom:10px;">' + cfg.title + '</div>';
                }
                if (cfg.content) {
                    h += '<div class="spa-content" style="font-size:14px;color:#555;line-height:1.7;word-break:break-word;">' + cfg.content + '</div>';
                }
                var btnText = cfg.btn || '知道了';
                if (cfg.link) {
                    h += '<a class="spa-btn" href="' + cfg.link + '" target="_blank" rel="noopener" style="display:block;margin-top:18px;padding:10px 0;background:linear-gradient(135deg,#ff6b6b,#ff8e53);color:#fff;border-radius:22px;font-size:15px;font-weight:600;text-decoration:none;">' + btnText + '</a>';
                } else {
                    h += '<div class="spa-btn" style="display:block;margin-top:18px;padding:10px 0;background:linear-gradient(135deg,#ff6b6b,#ff8e53);color:#fff;border-radius:22px;font-size:15px;font-weight:600;cursor:pointer;">' + btnText + '</div>';
                }
                h += '</div></div>';
                wrap.innerHTML = h;
                document.body.appendChild(wrap);

                function close() {
                    if (wrap.parentNode) wrap.parentNode.removeChild(wrap);
                }
                wrap.querySelector('.spa-mask').addEventListener('click', close);
                wrap.querySelector('.spa-close').addEventListener('click', close);
                var btnEl = wrap.querySelector('.spa-btn');
                if (btnEl && !cfg.link) btnEl.addEventListener('click', close);

                if (!document.getElementById('spaStyle')) {
                    var st = document.createElement('style');
                    st.id = 'spaStyle';
                    st.textContent = '@keyframes spaIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}';
                    document.head.appendChild(st);
                }
            }
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', function () { setTimeout(init, 500); });
            } else {
                setTimeout(init, 500);
            }
        })();
    </script>
</head>
