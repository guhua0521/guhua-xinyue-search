<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分站已停用</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f6f8;
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        .box {
            text-align: center;
            background: #fff;
            border-radius: 12px;
            padding: 48px 64px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, .06);
        }
        .box .icon {
            font-size: 56px;
        }
        .box h1 {
            font-size: 20px;
            color: #333;
            margin: 18px 0 8px;
        }
        .box p {
            color: #999;
            font-size: 14px;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">🚫</div>
        <h1>该分站已停用或到期</h1>
        <p>如需继续使用，请联系平台方开通续费</p>
    </div>
</body>
</html>
